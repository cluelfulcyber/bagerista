[package]
name = "bagerista"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
mime_guess = "2.0.5"
rand = "0.10.3"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

# Argon2 is ~50x slower without optimisation; keep login and tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
