{#- „Изход“ is a POST (with the CSRF token), never a link: a link could be
    triggered by another site. Expects `layout` and `logout_class`. -#}
<form class="logout" action="/izhod" method="post"><input type="hidden" name="csrf_token" value="{{ layout.csrf_token }}"><button class="{{ logout_class }}" type="submit">Изход</button></form>
